<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Recommendation System</title>
    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>E-Commerce Recommendation System</h1>

    <form method="POST">
        <input
            type="text"
            name="product"
            placeholder="Enter Product Name"
            required
        >

        <button type="submit">
            Recommend
        </button>
    </form>

    {% if product %}
        <h2>
            Recommendations for "{{ product }}"
        </h2>

        {% if recommendations %}
            <ul>
                {% for item in recommendations %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No recommendations found.</p>
        {% endif %}
    {% endif %}

</div>

</body>
</html>
